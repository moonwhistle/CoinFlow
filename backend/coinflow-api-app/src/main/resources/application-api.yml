spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ohlc
    username: ohlc_user
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
    com.coinflow: debug

server:
  port: 8080

coinflow:
  chart:
    hot-window:
      enabled: true
      refresh-interval-ms: 1000
      initial-delay-ms: 1000
      symbol-refresh-interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: prometheus, metrics, health
  metrics:
    tags:
      application: coinflow-api
