server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: coinflow-ws-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics
  metrics:
    tags:
      application: coinflow-ws-gateway
