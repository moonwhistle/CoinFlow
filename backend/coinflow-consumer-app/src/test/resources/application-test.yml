spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

coinflow:
  async:
    db-persist:
      core-pool-size: 3
      max-pool-size: 5
      queue-capacity: 5000
      keep-alive-seconds: 60
      thread-name-prefix: test-db-
      max-attempts: 3
      retry-delay: 1000
      retry-multiplier: 2

redis:
  stream:
    tick:
      stream-key: test-stream
      group: test-group
      consumer-name: test-consumer
