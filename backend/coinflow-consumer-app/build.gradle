plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':coinflow-core')
    implementation project(':coinflow-common')
    implementation project(':coinflow-infra-redis')

    // redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // web (for actuator HTTP endpoints)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // jpa (for runtime transaction & repository access)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // ConfigurationProperties metadata
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // cache
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    compileOnly "jakarta.persistence:jakarta.persistence-api:3.1.0"

    // retry
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
}

bootJar { enabled = true }
jar { enabled = false }
