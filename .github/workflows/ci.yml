name: CI

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/docker/**'
      - '.github/workflows/**'
  push:
    branches: [ "master" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/docker/**'
      - '.github/workflows/**'

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Run backend tests
        run: |
          cd backend
          chmod +x ./gradlew
          ./gradlew test --continue

  frontend-check:
    name: Frontend Lint And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend lint
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build
