name: Backend CD

on:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ "master" ]
    types: [ "completed" ]

jobs:
  build-and-deploy:
    name: Build Images And Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Detect backend deployment changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- \
            backend \
            infra/docker; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No backend deployment changes detected."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Backend deployment changes detected."
          fi

      - name: Set up JDK 17
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Build backend JARs
        if: steps.changes.outputs.deploy == 'true'
        run: |
          cd backend
          chmod +x ./gradlew
          ./gradlew build

      - name: Log in to Docker Hub
        if: steps.changes.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        if: steps.changes.outputs.deploy == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          cd infra/docker
          docker compose -f docker-compose-prod.yml build
          docker compose -f docker-compose-prod.yml push

      - name: Deploy to EC2
        if: steps.changes.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,REDIS_PASSWORD,DEPLOY_SHA
          script: |
            cd ~/CoinFlow
            git fetch origin master
            git checkout "$DEPLOY_SHA"

            export DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME
            export REDIS_PASSWORD=$REDIS_PASSWORD

            cd infra/docker
            docker compose -f docker-compose-prod.yml pull
            docker compose -f docker-compose-prod.yml up -d --remove-orphans
            docker compose -f docker-compose-prod.yml restart nginx
            docker image prune -f
