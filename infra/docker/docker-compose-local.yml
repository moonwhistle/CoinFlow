# Local development only

services:
  postgres:
    image: postgres:16
    container_name: ohlc-postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ohlc
      POSTGRES_USER: ohlc_user
      POSTGRES_PASSWORD: ohlc_pass
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--bind", "0.0.0.0", "--appendonly", "yes", "--protected-mode", "no" ]
    restart: always
    healthcheck:
      test: [ "CMD", "bash", "-c", "redis-cli -h 127.0.0.1 ping | grep PONG" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
