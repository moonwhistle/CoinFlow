services:
  prometheus:
    image: prom/prometheus:latest
    container_name: coinflow-prometheus-local
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    # Mac 환경에서 컨테이너가 로컬호스트(스프링부트)에 접근하기 위한 설정
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: coinflow-grafana-local
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: coinflow-redis-exporter
    environment:
      - REDIS_ADDR=redis-local:6379
    command: ["-check-streams"]
    ports:
      - "9121:9121"
    # Redis가 별도로 떠 있으므로 호스트를 찾아갈 수 있게 함
    extra_hosts:
      - "redis-local:host-gateway"
    restart: unless-stopped
