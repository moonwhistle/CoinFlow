global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'coinflow-apps'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080' # API App
          - 'host.docker.internal:8081' # Consumer (IDE) or WS-Gateway
          - 'host.docker.internal:8082' # Collector (IDE) or Consumer (Docker)
          - 'host.docker.internal:8083' # Collector (Docker)
