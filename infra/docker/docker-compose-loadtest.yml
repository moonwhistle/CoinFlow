# CoinFlow Sustained Load Test Environment (EC2 T2.micro Simulation)
# ONLY APPLICATION MODULES (Assuming DB & Redis are already running on host)

services:
  # 부하 발생기 (수집기 대체)
  load-test-producer:
    build:
      context: ../../backend/coinflow-load-test
      dockerfile: Dockerfile
    container_name: coinflow-loadtest-producer
    environment:
      - REDIS_HOST=redis-local
      - REDIS_PORT=6379
      - TARGET_TPS=1000
      - SYMBOLS=btcusdt
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    extra_hosts:
      - "redis-local:host-gateway"
    depends_on:
      - consumer-app

  # 타겟: 컨슈머 (메모리 제한 모드)
  consumer-app:
    build:
      context: ../../backend/coinflow-consumer-app
      dockerfile: Dockerfile
    container_name: coinflow-consumer-local
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_CONFIG_NAME=application-consumer
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=redis-local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ohlc-postgres-local:5432/ohlc
      - SPRING_DATASOURCE_USERNAME=ohlc_user
      - SPRING_DATASOURCE_PASSWORD=1234
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms256m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
    extra_hosts:
      - "redis-local:host-gateway"
      - "ohlc-postgres-local:host-gateway"

  # 기타 부가 서비스
  api-app:
    build:
      context: ../../backend/coinflow-api-app
      dockerfile: Dockerfile
    container_name: coinflow-api-local
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_CONFIG_NAME=application-api
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=redis-local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ohlc-postgres-local:5432/ohlc
      - SPRING_DATASOURCE_USERNAME=ohlc_user
      - SPRING_DATASOURCE_PASSWORD=1234
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms128m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
    extra_hosts:
      - "redis-local:host-gateway"
      - "ohlc-postgres-local:host-gateway"

  ws-gateway:
    build:
      context: ../../backend/coinflow-ws-gateway
      dockerfile: Dockerfile
    container_name: coinflow-ws-local
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_CONFIG_NAME=application-ws
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=redis-local
      - JAVA_TOOL_OPTIONS=-Xmx64m -Xms64m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    extra_hosts:
      - "redis-local:host-gateway"

  replay-app:
    build:
      context: ../../backend/coinflow-replay-app
      dockerfile: Dockerfile
    container_name: coinflow-replay-local
    environment:
      - SPRING_CONFIG_NAME=application-replay
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=redis-local
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ohlc-postgres-local:5432/ohlc
      - SPRING_DATASOURCE_USERNAME=ohlc_user
      - SPRING_DATASOURCE_PASSWORD=1234
      - JAVA_TOOL_OPTIONS=-Xmx128m -Xms128m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
    extra_hosts:
      - "redis-local:host-gateway"
      - "ohlc-postgres-local:host-gateway"
