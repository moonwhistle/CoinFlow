# ============================================================
# Nginx Reverse Proxy Configuration - CoinFlow
#
# Routes:
#   /api/*  → api-app:8080  (REST API)
#   /ws/*   → ws-server:8081 (WebSocket)
# ============================================================

events {
    worker_connections 1024;
}

http {

    upstream api_backend {
        server api-app:8080;
    }

    upstream ws_backend {
        server ws-server:8081;
    }

    # ──────────────────────────────────────────────
    # HTTP Server (Port 80)
    # ──────────────────────────────────────────────
    server {
        listen 80;
        server_name api.cocoin.store cocoin.store;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────
    # HTTPS Server (Port 443)
    # ──────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name api.cocoin.store cocoin.store;

        ssl_certificate     /etc/letsencrypt/live/api.cocoin.store/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.cocoin.store/privkey.pem;

        # REST API
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket timeout
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health check endpoint
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
